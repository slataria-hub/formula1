name: F1 DRAFT update (no publication)
on:
  push:
    branches: [feature/f1-002-historical-import]
  workflow_dispatch:
  schedule:
    - cron: '23 5,17 * * *'
permissions:
  contents: read
concurrency:
  group: f1-draft-update-${{ github.ref }}
  cancel-in-progress: false
jobs:
  draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Run tests
        run: |
          .venv/bin/python -m unittest discover -s tests -v
          node --test tests/*.mjs
      - name: Prepare and rehearse DRAFT update
        env:
          F1DB_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .venv/bin/python tools/cloud_update.py --output private/cloud-run
      - name: Upload diagnostic reports (no user data)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: f1-draft-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            private/cloud-run/reports/cloud-summary.json
            private/cloud-run/reports/activation.json
            private/cloud-run/reports/update/*-report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload validated DRAFT candidate
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: f1-draft-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: private/cloud-run/reports/update/candidate.json
          if-no-files-found: error
          retention-days: 14
