name: F1 DRAFT update (read-only rehearsal; no publication)
# F1-012.3: no push/schedule triggers, no remote writes or artifact uploads.
# Prior persist_draft.py update remains available for a separately authorized stage.
on:
  workflow_dispatch:
    inputs:
      check_upstream:
        description: Check new F1DB release in disposable rehearsal (no persistence)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: f1-draft-data
  cancel-in-progress: false
jobs:
  draft:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      F1_PUBLIC_PROFILE: circuits-only # public source mirror only; local tests use full flags
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.18'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.5'
          package-manager-cache: false
      - name: Install and verify dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-pages.lock
          python -m pip check
          python tools/repository_audit.py tracked
      - name: Targeted unit checks (not F1-008)
        run: |
          for test in test_static_build.py test_prepare_publication.py test_preview_build.py test_prepare_update.py test_sync_media.py test_collect_media.py test_activate_update.py test_persist_draft.py test_release_store.py test_repository_audit.py test_ci_rehearsal.py; do
            python -m unittest discover -s tests -p "$test" -v
          done
          node --test tests/*.mjs
      - name: DATA — verify stored DRAFT and optionally rehearse new release
        env:
          CHECK_UPSTREAM: ${{ inputs.check_upstream }}
          F1DB_GITHUB_TOKEN: ${{ github.token }}
        run: python tools/ci_rehearsal.py data --output private/ci-rehearsal
      - name: MEDIA — verify synthetic MEDIA only (real media remains offline)
        run: python tools/ci_rehearsal.py media --output private/ci-rehearsal
      - name: BUILD — assemble and verify exact stored DRAFT (no upload)
        run: python tools/ci_rehearsal.py build --output private/ci-rehearsal
