# TEMPLATE ONLY. Do not install on GitHub before separate architect/owner GO.
name: F1 dependency rehearsal (read-only, no deploy)
'on':
  push:
    branches:
      - release/f10124-first-pages
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13.18'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.5'
          package-manager-cache: false
      - name: Verify dependencies and advisories
        run: bash ci-rehearsal.sh
