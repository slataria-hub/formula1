name: F1 controlled Pages deployment
on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Full approved f1-releases commit SHA (not a branch or tag)
        type: string
        required: true
      mode:
        description: Initial/new publication or separately authorized rollback
        type: choice
        options: [publish, rollback]
        default: publish
permissions: {}
concurrency:
  group: f1-pages-production
  cancel-in-progress: false
env:
  F1_APPROVAL_SHA256: ${{ vars.F1_APPROVAL_SHA256 }}
  RELEASE_COMMIT: ${{ inputs.release_commit }}
  F1_DEPLOY_MODE: ${{ inputs.mode }}
  PYTHONDONTWRITEBYTECODE: '1'
  F1_PUBLIC_PROFILE: circuits-only
jobs:
  source:
    if: github.ref == 'refs/heads/main' && github.repository == 'slataria-hub/formula1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check clean source and full input
        run: |
          test -z "$(git status --porcelain)"
          grep -Fx 'export const FLAGS={};' web/preview/media.mjs
          ! grep -q 'data:image/' web/preview/media.mjs
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$F1_APPROVAL_SHA256" =~ ^[0-9a-f]{64}$ ]]
  inputs:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.18'
      - name: Install pinned dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-pages.lock
          python -m pip check
      - name: Verify exact release and external approval pin
        run: python tools/pages_release.py check --release-commit "$RELEASE_COMMIT"
  validation:
    needs: inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.18'
      - name: Install pinned dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-pages.lock
          python -m pip check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.5'
          package-manager-cache: false
      - name: Audit index and run targeted tests
        run: |
          python tools/repository_audit.py index
          for t in test_pages_release.py test_pages_integration.py test_prepare_approved_inputs.py test_repository_audit.py test_static_build.py test_release_store.py test_preview_build.py test_prepare_publication.py; do
            python -m unittest discover -s tests -p "$t" -v
          done
          node --test tests/*.mjs
      - name: Verify exact release and external approval pin
        run: python tools/pages_release.py check --release-commit "$RELEASE_COMMIT"
  build:
    needs: validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.18'
      - name: Install pinned dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-pages.lock
          python -m pip check
      - name: Assemble twice without upload, verify exact bytes
        run: |
          python tools/pages_release.py build --release-commit "$RELEASE_COMMIT" --output private/site-a
          python tools/pages_release.py build --release-commit "$RELEASE_COMMIT" --output private/site-b
          diff -qr private/site-a private/site-b
  approval:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.18'
      - name: Install pinned dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-pages.lock
          python -m pip check
      - name: Verify exact release and external approval pin
        run: python tools/pages_release.py check --release-commit "$RELEASE_COMMIT"
  artifact:
    needs: approval
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.18'
      - name: Install pinned dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-pages.lock
          python -m pip check
      - name: Rebuild and verify immediately before upload
        run: |
          python tools/pages_release.py build --release-commit "$RELEASE_COMMIT" --output private/pages-site
          python tools/pages_release.py verify --release-commit "$RELEASE_COMMIT" --output private/pages-site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: private/pages-site
          retention-days: 1
  deploy:
    needs: artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy approved artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
  post-deploy:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.18'
      - name: Install pinned dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-pages.lock
          python -m pip check
      - name: Verify publicly served bytes (no rollback side effects)
        run: python tools/post_deploy_smoke.py --release-commit "$RELEASE_COMMIT"
